name: Face ID Lock CI

on:
  push:
    branches: [main]
    paths:
      - "macos-faceid-lockscreen/**"
      - ".github/workflows/faceid-lock-ci.yml"
  pull_request:
    paths:
      - "macos-faceid-lockscreen/**"
      - ".github/workflows/faceid-lock-ci.yml"

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos-faceid-lockscreen
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          {
            echo "### Toolchain"
            echo '```'
            xcodebuild -version
            swift --version 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FaceIDLock.xcodeproj \
            -scheme FaceIDLock \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee xcodebuild.log

      # Logs need a GitHub sign-in to view; annotations and the summary are public.
      - name: Report failures
        if: failure()
        run: |
          grep -E ": (error|fatal error): " xcodebuild.log | sort -u | head -40 > errors.txt || true
          grep -E "^(xcodebuild: )?error: |: error: -|Test Case .* failed|XCTAssert|\*\* (BUILD|TEST) FAILED" xcodebuild.log | sort -u | head -40 >> errors.txt || true
          {
            echo "### xcodebuild failures"
            echo '```'
            cat errors.txt
            echo '```'
            echo "### Last 60 log lines"
            echo '```'
            tail -60 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error::${line#"$GITHUB_WORKSPACE/"}"
          done < errors.txt

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: macos-faceid-lockscreen/xcodebuild.log
