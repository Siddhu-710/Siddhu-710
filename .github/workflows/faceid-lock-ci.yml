name: Face ID Lock CI

on:
  push:
    branches: [main]
    paths:
      - "macos-faceid-lockscreen/**"
      - ".github/workflows/faceid-lock-ci.yml"
  pull_request:
    paths:
      - "macos-faceid-lockscreen/**"
      - ".github/workflows/faceid-lock-ci.yml"

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos-faceid-lockscreen
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FaceIDLock.xcodeproj \
            -scheme FaceIDLock \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            | tee xcodebuild.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: macos-faceid-lockscreen/xcodebuild.log
